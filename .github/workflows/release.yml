name: Release

# A release is a tag vX.Y.Z on master (same as gmaf-mvr). The version comes
# from the tag, so pom.xml keeps its base version and nothing is committed.
# Tag versions are immutable in GitHub Packages: never move or reuse a tag.

on:
  push:
    tags: [ "v[0-9]+.[0-9]+.[0-9]+" ]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Set release version from tag
        run: mvn -B --no-transfer-progress versions:set -DnewVersion="${GITHUB_REF_NAME#v}" -DgenerateBackupPoms=false

      # tests run here (unlike publish-snapshot): a release must pass them
      - name: Build, test and publish to GitHub Packages
        run: mvn -B --no-transfer-progress deploy -s $GITHUB_WORKSPACE/.github/workflows/maven-settings.xml -P github
        env:
          USER_NAME: ${{ secrets.USER_NAME }}
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}

      - name: Create GitHub Release
        run: gh release create "$GITHUB_REF_NAME" target/*.jar --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
